# Unit tests get the app's resources (isIncludeAndroidResources), and with them its merged manifest. Keep what they
# ran on before: a plain Application (the manifest's BookPlayerApplication wires RevenueCat, the database and
# the sync engine), and SDK 35, as the app targets 36, past what this Robolectric runs. A test needing either
# says so in its @Config.
application=android.app.Application
sdk=35
