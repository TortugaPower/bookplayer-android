[versions]
# 8.9.1+ required for compileSdk 36 (Play target-API deadline Aug 2026).
agp = "8.13.2"
# 2.2+ required: Billing 8.x / RevenueCat 9.x ship Kotlin 2.2 metadata.
kotlin = "2.2.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
# Bumped to 2.8.x so collectAsStateWithLifecycle (stable since 2.8.0) has an honest, coherent floor;
# the ecosystem resolves higher transitively anyway.
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.8.0"
composeBom = "2024.09.01"
wearCompose = "1.4.1"
material3 = "1.5.0-alpha16"
media3 = "1.7.1"
navigationCompose = "2.7.7"
media = "1.7.0"
okhttp = "4.12.0"
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
# 2.7+ required: 2.6.x KSP breaks on Kotlin 2.2 metadata (unexpected jvm signature V).
room = "2.8.4"
datastore = "1.1.1"
splashscreen = "1.0.1"
wearOngoing = "1.0.0"
# Constraint-only pin (see wear/build.gradle.kts): modernizes the transitive fragment:1.1.0 that
# GMS/tiles pull, per the Play SDK Console "outdated SDK" advisory.
fragment = "1.8.9"
# 2.11+ ships the R8 full-mode consumer rules that keep generic signatures of anonymous
# TypeToken subclasses; 2.10.1 lacks them and every `object : TypeToken<...>() {}` throws
# IllegalStateException in minified builds (caught live on the R8 smoke test).
gson = "2.11.0"
work = "2.9.0"
# 2.11 ships maintained R8 consumer rules (2.9 predates them), incl. Kotlin suspend-signature fixes.
retrofit = "2.11.0"
credential = "1.2.2"
googleid = "1.1.1"
coil = "2.6.0"
# Play requires Billing Library >= 8.0.0 from Aug 30, 2026; must stay on the same major
# as the BillingClient bundled by RevenueCat (purchases 9.x -> BC 8.x).
billing = "8.3.0"
# Play In-App Review (post-book-finish rating prompt; Play decides whether the dialog shows).
playReview = "2.0.2"
revenuecat = "9.29.1"
sentry = "7.18.1"
# Gradle plugin only (R8 mapping upload); the runtime SDK stays pinned above.
sentryPlugin = "4.14.1"
konfetti = "2.0.5"
playServicesWearable = "18.2.0"
# Matches the coroutines version resolved across the project (strictly 1.7.3).
coroutinesTest = "1.7.3"
# Wear Tiles + ProtoLayout (glanceable now-playing tile). tiles 1.6.x pairs with protolayout 1.4.x.
# tiles >= 1.5.0 is REQUIRED when targeting API 35: 1.4.1 throws SecurityException on Wear 5
# devices (Play SDK Console advisory against the 1.1.0 wear bundle; also the crash our
# WearApp.refreshGlanceSurfaces guard caught on the Wear OS 5 emulator).
wearTiles = "1.6.1"
wearProtolayout = "1.4.1"
# Wear watch-face complication data source (now-playing complication).
wearWatchface = "1.2.1"
# Bridges a suspend block to the ListenableFuture TileService.onTileRequest returns; matches coroutines 1.7.3.
coroutinesGuava = "1.7.3"

[libraries]
purchases = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }
# Wear OS Data Layer (MessageClient/CapabilityClient) — phone↔watch auth handoff.
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentry" }
sentry-okhttp = { group = "io.sentry", name = "sentry-okhttp", version.ref = "sentry" }
konfetti-compose = { group = "nl.dionsegijn", name = "konfetti-compose", version.ref = "konfetti" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
play-review = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credential" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credential" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-wear-ongoing = { group = "androidx.wear", name = "wear-ongoing", version.ref = "wearOngoing" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Legacy MediaBrowserCompat support library — only for androidx.media.utils.MediaConstants, the
# documented extras keys Android Auto reads for content-style (list/grid) + per-item play progress.
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutinesGuava" }
androidx-wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
androidx-wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
androidx-wear-protolayout-material = { group = "androidx.wear.protolayout", name = "protolayout-material", version.ref = "wearProtolayout" }
androidx-wear-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearWatchface" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# ProcessLifecycleOwner — lets the Wear app start its data-sync foreground service only while the process
# is foreground (background FGS starts throw on API 31+).
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# Wear OS Compose — the watch UI toolkit (androidx.wear.compose.material, NOT the phone's material3).
androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
# Wear compose-foundation: ScalingLazyColumn + curved layout for the remote list.
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
# Wear compose-navigation: SwipeDismissableNavHost for list -> now-playing -> more/chapters.
androidx-wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentryPlugin" }

