name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # `build` is a REQUIRED status check on main and develop, so this job must always run and always report:
  # a required check that never starts leaves a pull request waiting for a status forever. What is conditional
  # is the work inside it — a PR that touches no Android source has nothing for Gradle to do, and the runner
  # then costs seconds instead of the ~12 minutes an assemble + tests + lint + minified release build takes.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Stated, not inherited. This job runs PR-authored Gradle code, and under a repository default of "read and
    # write" it would carry a write token while doing so. `pull-requests: read` is what the scope step below needs
    # to list a pull request's files — it works today without it only because this repo is public, and would start
    # 403ing (and silently answering "build everything") the day it is not.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      # Only an explicit `false` skips the build below. A push (a merge into develop or main) always builds; so
      # does anything this cannot answer — a failed listing, a truncated one, an unrecognised path. The decision
      # itself lives in `scripts/ci-scope.sh` because it governs a REQUIRED check, and logic that can hand out a
      # green `build` for untested code has to be testable: `.github/claude/reviewer/test/ci-scope.test.mjs`
      # runs it against the cases that matter. A blip talking to the API must not fail this step — that would
      # red-flag the pull request over something a re-run fixes — so it falls into the same "build" answer.
      - name: Decide whether the Android build has to run
        id: scope
        timeout-minutes: 3
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! files="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')"; then
            echo "could not list the changed files; building" >&2
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Guarded for the same reason the call above is: this script exits non-zero on any error of its own, and
          # an unguarded failure here fails the step and so the required `build` check. The fallback is already
          # implicit — a script that dies before its final line leaves `outputs.android` empty, and every step
          # below runs on `!= 'false'` — so all that is needed is not to take the step down with it.
          if ! printf '%s\n' "$files" | bash scripts/ci-scope.sh >> "$GITHUB_OUTPUT"; then
            echo "the scope script failed; building" >&2
          fi

      # UNCONDITIONAL, and in this job rather than a new one because `build` is the required check. The reviewer
      # workflow also runs this suite — that copy gates the review — but its job `if:` skips draft pull requests,
      # forks and Dependabot, and `ci-scope.sh` calls `.github/claude/**` inert. Together those meant a pull
      # request that touched only the harness got NO tests at all: Gradle skipped in seconds, the reviewer job
      # never started, and a lockfile bump of the agent SDK could land on a green required check. ~90 seconds.
      - name: Set up Node for the reviewer harness
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the reviewer harness
        timeout-minutes: 8
        working-directory: .github/claude/reviewer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          node --test test/

      - name: Set up JDK 17
        if: steps.scope.outputs.android != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.scope.outputs.android != 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: steps.scope.outputs.android != 'false'
        run: chmod +x ./gradlew

      # The `dev` flavor defaults DEV_BASE_URL to the emulator loopback alias, so devDebug builds and
      # unit tests run without any secrets. These tasks run in every module that has the variant, so
      # they cover :app AND :wear (both declare the `env` flavor).
      - name: Assemble devDebug
        if: steps.scope.outputs.android != 'false'
        run: ./gradlew assembleDevDebug --stacktrace

      # :app/:wear tests via testDevDebugUnitTest; :core is a flavorless library, so its tests live
      # under testDebugUnitTest and must be invoked explicitly.
      - name: Run unit tests
        if: steps.scope.outputs.android != 'false'
        run: ./gradlew testDevDebugUnitTest :core:testDebugUnitTest --stacktrace

      - name: Lint
        if: steps.scope.outputs.android != 'false'
        run: ./gradlew lintDevDebug --stacktrace

      # Exercise the R8/resource-shrink release config on every PR: a missing keep rule or a
      # reflection path the @SerializedName completeness tests don't cover fails HERE instead of
      # at release-cut time. Builds unsigned and secretless (config falls back to empty strings,
      # signing attaches only when the keystore exists, Sentry upload skips without a token).
      - name: Assemble minified prodRelease (unsigned)
        if: steps.scope.outputs.android != 'false'
        run: ./gradlew :app:assembleProdRelease :wear:assembleProdRelease --stacktrace

      # Classes another process resolves BY NAME (manifest components, Room's _Impl, the Wear
      # ongoing-activity surface) must survive R8 with their names and packages intact. Play review
      # was the only thing that caught the 1.1.2 wear rejection; this catches it on the PR.
      - name: Audit R8 mapping (cross-process keeps)
        if: steps.scope.outputs.android != 'false'
        run: scripts/audit-mapping.sh app && scripts/audit-mapping.sh wear
