name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The `dev` flavor defaults DEV_BASE_URL to the emulator loopback alias,
      # so devDebug builds and unit tests run without any secrets.
      - name: Assemble devDebug
        run: ./gradlew assembleDevDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDevDebug --stacktrace
