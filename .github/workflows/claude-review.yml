name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

# Cancel an in-flight review when the PR is updated again (saves API cost on rapid pushes).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft PRs; they review on "ready_for_review".
    # Skip fork PRs: pull_request runs from a fork don't receive repo secrets
    # (ANTHROPIC_API_KEY), so the reviewer can't run — skip to keep the check
    # neutral instead of a hard failure.
    # Skip Dependabot for the same reason: its runs get a read-only token and no repository secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The LOOSEST bound in the file, and it has to be: every step below is capped, a step that hits its cap FAILS
    # (which is what lets the notes at the end run), but a step that is merely slow and succeeds still spends the
    # job's clock. So the step caps must fit inside this one with room to spare, or the job cap becomes the
    # binding one — and a job cancelled by ITS timeout runs no `if: failure()` step at all: no note, no summary,
    # a red check and nothing on the pull request.
    #
    # Every step below carries its own cap, sized from what the step actually takes (measured worst cases across
    # six runs: review 9.6 min, the harness's tests 62 s, install 6 s, node 5 s, checkout 2 s) — so these are hang
    # guards with an order of magnitude of headroom, not budgets. This number must exceed their sum with room to
    # spare, and `test/workflow.test.mjs` fails the build if it stops doing so: at 38 the sum was 37 and the worst
    # realistic path finished at 38:00 on the nose, which is not slack, it is a coincidence.
    timeout-minutes: 48
    permissions:
      contents: read
      pull-requests: write   # post inline + summary comments and resolve review threads
    # Accepted residual: for a same-repo `pull_request` event GitHub runs the workflow file, the harness and the
    # lockfile as they exist on the PR head, so anyone who can push a branch here can already reach the secrets
    # below by editing this file. Checking the harness out from the base ref would close one path and not the
    # class, since the workflow itself is still PR-authored. What limits the exposure is push access plus branch
    # protection on develop/main; the allowlist and env-stripping below constrain the *model*, which is a
    # different threat. Revisit with an environment protection rule if outside contributors ever get push access.
    steps:
      - name: Checkout PR head
        id: checkout
        timeout-minutes: 3
        uses: actions/checkout@v5
        with:
          # Check out the PR head commit (not the merge ref) so file line numbers
          # match the commit_id we anchor inline comments to.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          # The agent may `cat .git/config`; don't leave the checkout token in it.
          persist-credentials: false

      - name: Set up Node
        timeout-minutes: 3
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --ignore-scripts: the lockfile comes from the PR head, so an install hook would be PR-authored code
      # running before anything else in this job.
      # Both pre-review steps are bounded, and the bound is the point rather than the number: a step that hangs
      # (an install stuck on the registry, a test that never returns) would otherwise burn the job's 48 minutes,
      # and a job cancelled by ITS timeout does not run steps guarded by `if: failure()` — only `always()` or
      # `cancelled()`. The "did not run" note below would never fire, and the round would end as a red check with
      # nothing on the PR: the invisible failure the whole harness is organised against. A STEP timeout fails the
      # step instead of cancelling the job, so the note posts.
      - name: Install reviewer deps
        id: install
        timeout-minutes: 4
        working-directory: .github/claude/reviewer
        # The smoke check is the only thing that loads the SDK before the review runs: it is imported lazily inside
        # `runAgent`, and every test stubs that seam, so `node --test test/` cannot tell a good install from one
        # whose platform package was left unusable by the lifecycle scripts `--ignore-scripts` skips. Without it
        # the first thing to find out is the review step, minutes later.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --silent
          node -e "import('@anthropic-ai/claude-agent-sdk').then((m) => { if (typeof m.query !== 'function') { console.error('the agent SDK installed but exports no query()'); process.exit(1); } })"

      - name: Test the agent's tool allowlist and redaction
        id: harness-tests
        timeout-minutes: 6   # the suite is ~1 min; this is a hang guard, and the conservation fuzzer is the slow part
        working-directory: .github/claude/reviewer
        run: node --test test/

      - name: Run Claude review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # PAT/App token used ONLY to resolve review threads (GITHUB_TOKEN can't — "Resource not
          # accessible by integration"). Optional: if unset, stale comments only show as "Outdated".
          # Prefer a fine-grained PAT scoped to this repo with "Pull requests: read & write" — this step
          # runs PR-branch code, so a classic repo-scope PAT would over-reach if it ever leaked.
          REVIEW_RESOLVE_TOKEN: ${{ secrets.REVIEW_RESOLVE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Model is NOT pinned: review.mjs asks the Models API for the newest Opus-tier model on
          # every run (Opus 5 today). To pin, e.g. while diagnosing a regression, set an exact id.
          # REVIEW_MODEL: claude-opus-5
          REVIEW_MAX_TURNS: '200'  # a runaway guard only; the real bound is REVIEW_DEADLINE_MS (12 min) in review.mjs
        # Above the harness's own budget and well inside the job's 48, so review.mjs's clock is what ends this step
        # in every case it can: its 18 minutes are measured from before the model lookup, and the reconcile phase
        # that follows them is deliberately unclocked (up to 25 posts plus a resolve and a reply per closed
        # thread). At 22 this cap, not the harness, was the tighter of the two. If it does fire, the step FAILS
        # rather than cancelling the job, which is what lets the notes below run.
        timeout-minutes: 24
        run: node .github/claude/reviewer/review.mjs

      # A failure in the two steps above happens outside review.mjs, so nothing would reach the PR and the check
      # would go red with no comment. The review step explains itself, hence the step-scoped condition.
      - name: Say on the PR that the harness did not run
        # Every step before the review except the checkout, which this step depends on: it runs a file the
        # checkout provides, so a checkout failure takes this step with it (a second red step, no comment).
        # Node is preinstalled on ubuntu-latest, so setup-node failing is not fatal here either. The review step
        # itself is excluded because it explains its own failures.
        if: failure() && steps.checkout.outcome == 'success' && steps.review.outcome != 'failure'
        timeout-minutes: 3   # a read and a write; review.mjs arms its own 90-second network clock in this mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/claude/reviewer/review.mjs --setup-failed "a step before the review failed (dependency install or the harness's own tests), so no review ran on this commit"

      # And the failure the harness cannot report itself: the review step KILLED rather than failed — its own
      # timeout, an OOM — where none of review.mjs's handlers ever run, so the round would end as a red check with
      # nothing on the PR. `explained` is written by review.mjs whenever the pull request already carries its
      # summary or its own failure note; a killed step never gets to write it, so this fires exactly then. Without
      # that gate this note would replace review.mjs's own explanation (same heading) and trade the real error for
      # a generic one.
      - name: Say on the PR that the review step was killed
        if: failure() && steps.review.outcome == 'failure' && steps.review.outputs.explained != 'true'
        timeout-minutes: 3   # exclusive with the note above: one of the two runs, never both
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/claude/reviewer/review.mjs --setup-failed "the review step ended without writing a summary — it was killed rather than failing on its own terms (its 24-minute step timeout, or the runner ran out of memory)"
